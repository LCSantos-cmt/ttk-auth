<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Autorização recebida</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1d1d1b; --muted: #6b6b66; --box: #fff; --borda: #ddd; --ok: #0b7a5a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ececea; --muted: #9a9a95; --box: #1f1f1e; --borda: #333; --ok: #3cc497; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  code { display: block; word-break: break-all; background: var(--box); border: 1px solid var(--borda); border-radius: 8px; padding: 12px; font-size: .95rem; }
  button { margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--ok); color: #fff; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Autorização recebida</h1>
  <p id="texto">Copie o código abaixo e entregue ao sistema. Ele vale 30 minutos e só pode ser usado uma vez.</p>
  <code id="codigo"></code>
  <button id="copiar" type="button">Copiar código</button>
</main>
<script>
  // Página estática: nada é enviado a lugar nenhum; o código só aparece na tela de quem autorizou.
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  const state = params.get("state") || "";
  if (!code) {
    document.getElementById("titulo").textContent = "Nenhum código recebido";
    document.getElementById("texto").textContent = "Abra esta página pelo link de autorização do TikTok Shop.";
    document.getElementById("codigo").remove();
    document.getElementById("copiar").remove();
  } else {
    const valor = state ? `${state} ${code}` : code;
    document.getElementById("codigo").textContent = valor;
    document.getElementById("copiar").onclick = () =>
      navigator.clipboard.writeText(valor).then(() => (document.getElementById("copiar").textContent = "Copiado"));
    history.replaceState(null, "", location.pathname);
  }
</script>
</body>
</html>
